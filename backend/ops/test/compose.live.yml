services:
  # The base compose files keep the test services on a network namespace with
  # no network at all.  The live provider proof needs that same namespace to
  # reach the provider, so only the namespace owner changes.
  network-sandbox:
    network_mode: bridge

  backend-tests:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AVERQEL_LIVE_PROVIDER_TYPE: ${AVERQEL_LIVE_PROVIDER_TYPE:-}
      AVERQEL_LIVE_BASE_URL: ${AVERQEL_LIVE_BASE_URL:-}
      AVERQEL_LIVE_API_KEY: ${AVERQEL_LIVE_API_KEY:-}
      AVERQEL_LIVE_MODEL: ${AVERQEL_LIVE_MODEL:-}
      AVERQEL_LIVE_SECOND_MODEL: ${AVERQEL_LIVE_SECOND_MODEL:-}
