# Advanced Tool Scenarios (P1) - Run in CI but lower priority
# These cover planning, workflows, jobs, and advanced features

scenarios:
  # ============================================================
  # PLAN TOOLS (plan_submit, plan_read)
  # ============================================================

  - id: "plan_submit_001"
    category: "advanced"
    priority: 1
    prompt: "Create a plan to build a simple REST API with three endpoints: GET /users, POST /users, GET /users/{id}"
    expected_tools: ["plan_submit"]
    min_tool_calls: 1
    max_tool_calls: 3
    max_turns: 4
    assertions:
      no_errors: true
      contains_in_response: ["GET /users", "POST /users", "GET /users/{id}"]
    tags: ["plan", "planning", "api"]
    description: "Create a multi-step development plan"

  - id: "plan_read_001"
    category: "advanced"
    priority: 1
    prompt: "Read the current plan and tell me what the next step is"
    expected_tools: ["plan_read", "plan_submit"]
    min_tool_calls: 2
    max_tool_calls: 4
    max_turns: 5
    setup:
      create_plan:
        title: "Build REST API"
        steps:
          - "Design database schema"
          - "Implement GET /users"
          - "Implement POST /users"
          - "Implement GET /users/{id}"
          - "Write tests"
          - "Deploy"
    assertions:
      no_errors: true
      contains_in_response: ["Design database schema"]
    tags: ["plan", "planning", "read"]
    description: "Read existing plan"

  # ============================================================
  # GOAL TOOLS (goal_set, goal_read)
  # ============================================================

  - id: "goal_set_001"
    category: "advanced"
    priority: 1
    prompt: "Set a goal to 'Complete the user authentication module by end of week'"
    expected_tools: ["goal_set"]
    min_tool_calls: 1
    max_tool_calls: 2
    max_turns: 3
    assertions:
      no_errors: true
      contains_in_response: ["authentication", "end of week"]
    tags: ["goal", "planning"]
    description: "Set a new goal"

  # ============================================================
  # JOBS TOOLS (job_create, job_list, job_status, job_output, job_kill)
  # ============================================================

  - id: "job_create_001"
    category: "advanced"
    priority: 1
    prompt: "Create a background job that runs 'sleep 2 && echo done' and check its status"
    expected_tools: ["job_create", "job_status", "job_output"]
    min_tool_calls: 3
    max_tool_calls: 6
    max_turns: 8
    assertions:
      no_errors: true
      contains_in_response: ["done"]
    tags: ["job", "background", "async"]
    description: "Create and monitor background job"

  - id: "job_list_001"
    category: "advanced"
    priority: 1
    prompt: "List all current jobs and their statuses"
    expected_tools: ["job_list"]
    min_tool_calls: 1
    max_tool_calls: 2
    max_turns: 3
    assertions:
      no_errors: true
    tags: ["job", "list"]
    description: "List all jobs"

  # ============================================================
  # WORKFLOW TOOLS (workflow_run)
  # ============================================================

  - id: "workflow_run_001"
    category: "advanced"
    priority: 1
    prompt: "Run a workflow that creates a file, reads it, then deletes it"
    expected_tools: ["workflow_run"]
    min_tool_calls: 1
    max_tool_calls: 3
    max_turns: 5
    assertions:
      no_errors: true
    tags: ["workflow", "automation"]
    description: "Run a multi-step workflow"

  # ============================================================
  # DELEGATION TOOLS (delegate_task, delegate_read, delegate_write)
  # ============================================================

  - id: "delegate_task_001"
    category: "advanced"
    priority: 1
    prompt: "Delegate a task to research 'best practices for API versioning' and report back"
