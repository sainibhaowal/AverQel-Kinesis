<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bracketGlowLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b2161" />
      <stop offset="50%" stop-color="#0052ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="bracketGlowRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0b2161" />
      <stop offset="50%" stop-color="#0052ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0b2161" />
      <stop offset="60%" stop-color="#0052ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="neonPulse" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Bracket -->
  <path
    d="M 145,165 L 60,250 L 145,335"
    fill="none"
    stroke="url(#bracketGlowLeft)"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Bracket -->
  <path
    d="M 355,165 L 440,250 L 355,335"
    fill="none"
    stroke="url(#bracketGlowRight)"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Main Circuit Trunk & splits -->
  <g stroke="url(#circuitGrad)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top stem to split point -->
    <path d="M 250,110 L 250,180" />
    <!-- Split wrapping around the core -->
    <path d="M 250,180 L 225,205 L 225,295 L 250,320" />
    <path d="M 250,180 L 275,205 L 275,295 L 250,320" />
    <!-- Bottom split to end point -->
    <path d="M 250,320 L 250,390" />

    <!-- Symmetrical Horizontal Node Lines -->
    <path d="M 225,250 L 185,250" />
    <path d="M 275,250 L 315,250" />

    <!-- Outer Architectural Circuit Guides -->
    <path d="M 233,135 L 233,175 L 208,200 L 208,230 L 193,245 L 193,255 L 208,270 L 208,300 L 233,325 L 233,365" />
    <path d="M 267,135 L 267,175 L 292,200 L 292,230 L 307,245 L 307,255 L 292,270 L 292,300 L 267,325 L 267,365" />
  </g>

  <!-- Circuit Node Terminals -->
  <g fill="url(#circuitGrad)">
    <circle cx="250" cy="110" r="16.200000000000003" />
    <circle cx="250" cy="390" r="16.200000000000003" />
    <circle cx="185" cy="250" r="10.8" />
    <circle cx="315" cy="250" r="10.8" />
  </g>

  <!-- Central Core Singularity -->
  <g>

      <circle cx="250" cy="250" r="28" fill="#070b19" stroke="url(#circuitGrad)" stroke-width="9.600000000000001" />


    <!-- Supernova Core Core Glow Point -->
    <circle
      cx="250"
      cy="250"
      r="9"
      fill="#ffffff"
      filter="url(#neonPulse)"
      style="box-shadow: 0 0 20px #00f0ff"
    />
    <circle
      cx="250"
      cy="250"
      r="15"
      fill="#00f0ff"
      opacity="0.4"
      filter="url(#neonPulse)"
    />
  </g>
</svg>
