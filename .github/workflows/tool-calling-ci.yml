name: Tool-Calling CI (Fixture Replay)

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/app/deepspace/services/tools/**'
      - 'backend/app/deepspace/services/tool_*.py'
      - 'backend/tests/tool_calling/**'
      - 'backend/requirements.txt'
      - 'backend/requirements-dev.txt'
      - '.github/workflows/tool-calling-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/app/deepspace/services/tools/**'
      - 'backend/app/deepspace/services/tool_*.py'
      - 'backend/tests/tool_calling/**'
      - 'backend/requirements.txt'
      - 'backend/requirements-dev.txt'
      - '.github/workflows/tool-calling-ci.yml'
  workflow_dispatch:
    inputs:
      categories:
        description: 'Categories to replay (comma-separated)'
        required: false
        default: 'core,advanced,chaining,error'
      workers:
        description: 'Parallel workers'
        required: false
        default: '4'

env:
  PYTHON_VERSION: '3.12'
  FIXTURE_DIR: 'backend/tests/tool_calling/fixtures'

jobs:
  fixture-preflight:
    name: Check fixture baselines
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.baselines.outputs.available }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check required replay baselines
        id: baselines
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for category in core advanced chaining error; do
            fixture="${FIXTURE_DIR}/${category}_tools.jsonl"
            if [[ ! -s "$fixture" ]]; then
              echo "::warning::Tool-calling replay skipped; missing committed baseline: $fixture"
              missing=1
            fi
          done
          if ((missing)); then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

  replay-fixtures:
    name: Replay Fixtures (${{ matrix.category }})
    needs: fixture-preflight
    if: needs.fixture-preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        category: [core, advanced, chaining, error]
        # specialized skipped in CI (requires SSH, browser, display)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --disable-pip-version-check --no-input \
            -r requirements.txt -r requirements-dev.txt

      - name: Verify fixtures exist
        run: |
          ls -la ${{ env.FIXTURE_DIR }}/
          test -f ${{ env.FIXTURE_DIR }}/${{ matrix.category }}_tools.jsonl || {
            echo "Fixture file not found: ${{ matrix.category }}_tools.jsonl"
            echo "Run fixture recording locally first: python -m backend.tests.tool_calling.run_recorder --category ${{ matrix.category }}"
            exit 1
          }

      - name: Replay ${{ matrix.category }} fixtures
        run: |
          cd backend
          python -m tests.tool_calling.run_replay \
            --category ${{ matrix.category }} \
            --workers 2 \
            --fixture-dir ../${{ env.FIXTURE_DIR }}
        timeout-minutes: 20

      - name: Upload replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-${{ matrix.category }}
          path: |
            backend/tests/tool_calling/fixtures/
            alerts.log
          retention-days: 7

  validate-fixtures:
    name: Validate Fixtures
    needs: fixture-preflight
    if: needs.fixture-preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --disable-pip-version-check --no-input \
            -r requirements.txt -r requirements-dev.txt

      - name: Validate fixture integrity
        run: |
          cd backend
          python -m tests.tool_calling.run_replay --validate --fixture-dir ../${{ env.FIXTURE_DIR }}

      - name: Show fixture summary
        run: |
          cd backend
          python -m tests.tool_calling.run_replay --summary --fixture-dir ../${{ env.FIXTURE_DIR }}

  tool-coverage-check:
    name: Tool Coverage Check
    needs: fixture-preflight
    if: needs.fixture-preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --disable-pip-version-check --no-input \
            -r requirements.txt -r requirements-dev.txt

      - name: Check tool coverage
        run: |
          cd backend
          python -m tests.tool_calling.check_fixture_coverage \
            --fixture-dir tests/tool_calling/fixtures

  # Summary job
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [fixture-preflight, replay-fixtures, validate-fixtures, tool-coverage-check]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.fixture-preflight.outputs.available }}" != "true" ]]; then
            echo "Tool-calling replay and coverage were skipped: committed JSONL baselines are missing."
            echo "Record, review, and commit the baseline fixtures to activate these checks."
            exit 0
          fi
          if [[ "${{ needs.replay-fixtures.result }}" != "success" ]]; then
            echo "Fixture replay failed"
            exit 1
          fi
          if [[ "${{ needs.validate-fixtures.result }}" != "success" ]]; then
            echo "Fixture validation failed"
            exit 1
          fi
          if [[ "${{ needs.tool-coverage-check.result }}" != "success" ]]; then
            echo "Tool coverage check failed"
            exit 1
          fi
          echo "All CI checks passed!"
