name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install Actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint all GitHub Actions workflows
        run: |
          actionlint_bin="$(go env GOPATH)/bin"
          export PATH="$actionlint_bin:$PATH"
          actionlint -color

      - name: Check patch whitespace
        run: git diff --check

  backend:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Create backend virtual environment
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input \
            -r requirements.txt -r requirements-dev.txt pre-commit
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies for repository hooks
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Run repository pre-commit checks
        run: pre-commit run --all-files

      - name: Check patch whitespace
        run: git diff --check

      - name: Run Ruff
        working-directory: backend
        run: bash ../.github/scripts/run-backend-gate.sh ruff

      - name: Run Black check
        working-directory: backend
        run: bash ../.github/scripts/run-backend-gate.sh black

      - name: Run mypy
        working-directory: backend
        run: bash ../.github/scripts/run-backend-gate.sh mypy

      - name: Run Bandit
        working-directory: backend
        run: bash ../.github/scripts/run-backend-gate.sh bandit

      - name: Audit Python dependencies with pip-audit
        working-directory: backend
        run: bash ../.github/scripts/run-backend-gate.sh pip-audit

      - name: Audit Python dependencies with Safety (advisory)
        id: safety-audit
        continue-on-error: true
        working-directory: backend
        run: bash ../.github/scripts/run-backend-gate.sh safety

      - name: Summarize Safety findings
        if: steps.safety-audit.outcome == 'failure'
        run: |
          {
            echo "### Safety audit requires review"
            echo
            echo "Safety reported dependency findings. The report remains visible in the job log."
            echo "Blocking dependency gates are pip-audit and the frontend production audit."
            echo "Resolve the reported platform pins or record an approved security decision before release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run database-free backend tests
        working-directory: backend
        run: >-
          PATH="/usr/bin:/bin:$PATH"
          .venv/bin/pytest -q -m unit_no_db --dist=loadgroup

  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --dir frontend lint

      - name: Run frontend tests
        run: pnpm --dir frontend test

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Audit production frontend dependencies
        run: pnpm --dir frontend audit --prod --audit-level high

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Chromium and Linux browser dependencies
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run isolated loopback browser tests
        run: pnpm --dir frontend e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  desktop-shell:
    name: Desktop shell
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: applications/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm --dir applications/desktop install --frozen-lockfile

      - name: Test Electron shell
        run: pnpm --dir applications/desktop test

  desktop-packaged-runtime:
    name: Desktop Linux packaged runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: applications/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm --dir applications/desktop install --frozen-lockfile

      - name: Build the frozen local backend
        run: pnpm --dir applications/desktop build:backend

      - name: Smoke-test the packaged local backend
        run: pnpm --dir applications/desktop smoke:backend

  dependency-review-capability:
    name: Dependency graph capability
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.capability.outputs.enabled }}
    steps:
      - name: Check dependency graph availability
        id: capability
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_API: ${{ github.api_url }}/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --output "$response_file" --write-out '%{http_code}' \
            "$REPOSITORY_API")"

          case "$http_code" in
            200)
              graph_status="$(jq -r '.security_and_analysis.dependency_graph.status // "disabled"' "$response_file")"
              if [[ "$graph_status" == enabled ]]; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
              else
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                echo "::warning::GitHub dependency graph is not enabled; Dependency Review will be skipped."
              fi
              ;;
            403|404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub dependency graph is unavailable; Dependency Review will be skipped."
              ;;
            *)
              cat "$response_file"
              exit 1
              ;;
          esac

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && needs.dependency-review-capability.outputs.enabled == 'true'
    needs: dependency-review-capability
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  ci-passed:
    name: CI Passed
    if: always()
    needs:
      - workflow-lint
      - backend
      - frontend
      - browser-e2e
      - desktop-shell
      - desktop-packaged-runtime
      - dependency-review-capability
      - dependency-review
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable CI job to pass
        env:
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BROWSER_E2E: ${{ needs.browser-e2e.result }}
          DESKTOP_SHELL: ${{ needs.desktop-shell.result }}
          DESKTOP_PACKAGED_RUNTIME: ${{ needs.desktop-packaged-runtime.result }}
          DEPENDENCY_REVIEW_CAPABILITY: ${{ needs.dependency-review-capability.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        run: |
          failed=0
          for check in \
            "workflow-lint:$WORKFLOW_LINT" \
            "backend:$BACKEND" \
            "frontend:$FRONTEND" \
            "browser-e2e:$BROWSER_E2E" \
            "desktop-shell:$DESKTOP_SHELL" \
            "desktop-packaged-runtime:$DESKTOP_PACKAGED_RUNTIME" \
            "dependency-review-capability:$DEPENDENCY_REVIEW_CAPABILITY" \
            "dependency-review:$DEPENDENCY_REVIEW"; do
            name="${check%%:*}"
            result="${check#*:}"
            if [[ "$name" == dependency-review* && "$result" == skipped ]]; then
              continue
            fi
            if [[ "$result" != success ]]; then
              echo "::error::${name} finished with ${result}"
              failed=1
            fi
          done
          exit "$failed"
